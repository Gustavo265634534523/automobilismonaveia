# Números além do placar, pela ESPN, a cada 3 horas:
# - futebol (.github/estatisticas-futebol.js): temporada de cada jogador, seleção da rodada e brasileiros na Europa;
# - NBA (.github/nba-extras.js): noite da NBA, lesões, brasileiros na NBA e médias da temporada.
# O agendamento só roda na branch principal; nas outras, roda quando o robô muda ou quando pedido à mão.
name: Estatísticas
on:
  push:
    paths:
      - '.github/estatisticas-futebol.js'
      - '.github/nba-extras.js'
      - '.github/derivados-futebol.js'
      - '.github/workflows/estatisticas.yml'
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salvar-no-site
  cancel-in-progress: false
jobs:
  estatisticas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Futebol (temporada, seleção da rodada, brasileiros na Europa)
        run: node .github/estatisticas-futebol.js || true
      - name: Resumos pequenos para os jogos (time atual e Mais ou menos)
        run: node .github/derivados-futebol.js || true
      - name: NBA (noite, lesões, brasileiros, médias)
        run: node .github/nba-extras.js || true
      - name: Salvar no site
        run: |
          git config user.name "Robô Fan Zone"
          git config user.email "automobilismonaveiacontato@gmail.com"
          git add assets/dados/temporada-futebol.js assets/dados/destaques-futebol.js assets/dados/forma-futebol.js assets/dados/times-atuais.js assets/dados/mais-ou-menos-futebol.js assets/dados/nba-extras.js assets/dados/temporada-nba.js .github/cache
          git diff --cached --quiet && exit 0
          git commit -m "Robô: estatísticas do futebol e da NBA"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
