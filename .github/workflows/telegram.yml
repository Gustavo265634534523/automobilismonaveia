# Robô do Telegram: avisos de largada, vencedores, resumos e mudança de horário.
# Roda sozinho a cada 5 minutos no GitHub (o computador do dono pode ficar desligado).
# Segredo necessário: TELEGRAM_CHAVE (Settings → Secrets and variables → Actions).
name: Telegram avisos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salvar-no-site
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mandar avisos
        env:
          TELEGRAM_CHAVE: ${{ secrets.TELEGRAM_CHAVE }}
          TELEGRAM_CANAL: '-1004483514581'
        run: node .github/avisos/telegram.js
      - name: Guardar o que já foi avisado
        run: |
          git config user.name "Robô Na Veia"
          git config user.email "automobilismonaveiacontato@gmail.com"
          git add .github/avisos/enviados.json
          git diff --cached --quiet && exit 0
          git commit -m "Robô: avisos do Telegram"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
