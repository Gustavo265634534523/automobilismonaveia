# Depois de cada corrida: Raio-x e Duelo da F1, amostra de telemetria da página inicial (OpenF1) e Raio-x da MotoGP (resultados oficiais da MotoGP).
# Roda a cada 30 minutos; só faz algo quando sai resultado novo.
name: F1 pos-corrida
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salvar-no-site
  cancel-in-progress: false
jobs:
  raiox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Raio-x e Duelo
        run: node _ferramentas/raiox-automatico.js
      - name: Mapa da próxima pista (curvas e setores)
        run: node .github/pista-proxima.js || true
      - name: Dados do widget e do papel de parede
        run: node .github/widget-dados.js || true
      - name: Telemetria da página inicial
        run: node .github/telemetria-amostra.js || true
      - name: Raio-x da MotoGP
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node .github/raiox-motogp.js || true
      - name: Salvar no site
        run: |
          git config user.name "Robô Na Veia"
          git config user.email "automobilismonaveiacontato@gmail.com"
          git add assets/dados
          git diff --cached --quiet && exit 0
          git commit -m "Robô: Raio-x e Duelo da última corrida"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
