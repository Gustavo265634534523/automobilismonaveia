# Placar automático (ESPN): jogos, placares, tabelas e líderes da NBA em assets/dados/ao-vivo.js, a cada 10 minutos,
# e o lance a lance e as escalações dos jogos de futebol em assets/dados/partidas/.
# Também refaz as enquetes ("Quem vence?", com o próximo jogo grande) e o bolão (.github/bolao.js: jogos abertos, resultados e ranking).
# O agendamento só roda na branch principal; nas outras, roda quando o robô muda ou quando pedido à mão.
name: Placar automático
on:
  push:
    paths:
      - '.github/placar.js'
      - '.github/workflows/placar.yml'
      - '.github/partidas.js'
      - '.github/bolao.js'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salvar-no-site
  cancel-in-progress: false
jobs:
  placar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar placares e tabelas
        run: node .github/placar.js
      - name: Lance a lance e escalações do futebol
        run: node .github/partidas.js || true
      - name: Enquetes
        run: node .github/enquete.js || true
      - name: Bolão (jogos abertos, resultados e ranking)
        run: node .github/bolao.js || true
        env:
          BOLAO_CHAVE: ${{ secrets.BOLAO_CHAVE }}
          BOLAO_URL: ${{ secrets.BOLAO_CHAVE && 'https://arena-bolao.naveia-contas.workers.dev/' || '' }}
      - name: Salvar no site
        run: |
          git config user.name "Robô Fan Zone"
          git config user.email "automobilismonaveiacontato@gmail.com"
          git add assets/dados/ao-vivo.js assets/dados/partidas assets/dados/escudos.js assets/img/escudos .github/placar-relatorio.txt assets/dados/enquete.json assets/dados/bolao.json
          git diff --cached --quiet && exit 0
          git commit -m "Robô: placares e tabelas atualizados"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
