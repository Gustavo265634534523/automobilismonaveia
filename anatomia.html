<style>
.an-pagina { padding: calc(var(--topo) + 36px) 0 70px; }
.an-rot { margin: 0 0 6px; font: 800 13px var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--sangue-vivo); }
.an-pagina h1 { margin: 0 0 10px; font: 900 clamp(34px, 5.5vw, 68px)/1 var(--display); text-transform: uppercase; }
.an-pagina h1 span { color: var(--sangue-vivo); }
.an-lead { max-width: 760px; margin: 0 0 24px; font-size: 18px; color: #c3c8cd; }
/* palco em estilo "planta técnica": grade fina e o carro */
.an-palco { position: relative; border: 1px solid var(--linha); background:
  linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 40px 40px, #0b0c0e; overflow: hidden; }
.an-carro { position: relative; aspect-ratio: 2400 / 1357; }
.an-abas { display: inline-flex; margin: 0 0 14px; border: 1px solid var(--linha); }
.an-abas button { min-height: 42px; padding: 0 18px; background: none; border: 0; color: #aab0b6; font: 800 15px var(--texto); cursor: pointer; }
.an-abas button[aria-pressed="true"] { background: var(--sangue); color: #fff; }
.an-carro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.an-ponto { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--sangue-vivo); color: #fff; font: 900 14px var(--texto); cursor: pointer; box-shadow: 0 0 0 4px rgba(227,52,60,.3), 0 4px 14px rgba(0,0,0,.6); z-index: 2; transition: transform .15s; }
.an-ponto::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); animation: an-pulso 2s infinite; }
.an-ponto:hover, .an-ponto[aria-pressed="true"] { transform: scale(1.18); background: #fff; color: var(--sangue); }
@keyframes an-pulso { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.an-cartao { position: absolute; z-index: 3; width: min(360px, 44%); padding: 18px 20px; background: rgba(12,13,15,.94); border: 1px solid var(--linha); border-top: 3px solid var(--sangue-vivo); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
.an-cartao h2 { margin: 0 0 4px; font: 800 24px var(--display); text-transform: uppercase; }
.an-cartao .an-num { margin: 0 0 10px; font: 900 18px var(--display); color: var(--sangue-vivo); }
.an-cartao p { margin: 0; font-size: 16px; color: #d3d8dc; line-height: 1.5; }
.an-dica { position: absolute; left: 16px; bottom: 12px; z-index: 1; font-size: 14px; color: #8e979f; }
.an-ficha { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.an-ficha div { padding: 16px; background: var(--carbono); border: 1px solid var(--linha); border-left: 3px solid var(--sangue-vivo); }
.an-ficha b { display: block; font: 900 clamp(22px, 2.6vw, 32px) var(--display); }
.an-ficha span { color: #aab0b6; font-size: 14px; }
.an-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 30px; padding: 0; list-style: none; }
.an-lista li { padding: 16px 18px; background: var(--carbono); border: 1px solid var(--linha); }
.an-lista h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font: 800 18px var(--texto); }
.an-lista h3 i { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--sangue-vivo); font: 900 12px var(--texto); font-style: normal; }
.an-lista .an-num { margin: 0 0 6px; color: var(--sangue-vivo); font-weight: 800; }
.an-lista p { margin: 0; color: #c3c8cd; font-size: 15px; }
.an-pe { margin-top: 26px; font-size: 13px; color: #8e979f; }
@media (max-width: 760px) {
  .an-ponto { width: 26px; height: 26px; margin: -13px 0 0 -13px; font-size: 11px; }
  .an-cartao { display: none; }
  .an-ficha { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .an-ficha div:last-child { grid-column: 1 / -1; }
}

    <div class="an-abas" role="group" aria-label="Escolha"><button type="button" data-q="f1" aria-pressed="true">Fórmula 1</button><button type="button" data-q="f2" aria-pressed="false">Fórmula 2</button><button type="button" data-q="f3" aria-pressed="false">Fórmula 3</button><button type="button" data-q="indy" aria-pressed="false">IndyCar</button><button type="button" data-q="nascar" aria-pressed="false">NASCAR</button><button type="button" data-q="wec" aria-pressed="false">WEC</button><button type="button" data-q="imsa" aria-pressed="false">IMSA</button><button type="button" data-q="dtm" aria-pressed="false">DTM</button><button type="button" data-q="porsche" aria-pressed="false">Porsche Cup</button><button type="button" data-q="wrc" aria-pressed="false">WRC</button><button type="button" data-q="motogp" aria-pressed="false">MotoGP</button><button type="button" data-q="stock" aria-pressed="false">Stock Car</button><button type="button" data-q="fe" aria-pressed="false">Fórmula E</button></div>

<script>
(function () {
  var esc = window.esc, carro = document.getElementById('an-carro'), img = document.getElementById('an-img'), A;
  var Q = { f1: { d: window.ANATOMIA_F1, tit: 'Anatomia de um carro de <span>Fórmula 1</span>', alt: 'Carro de Fórmula 1 visto de lado (imagem gerada, sem equipe nem marca)' },
    motogp: { d: window.ANATOMIA_MOTOGP, tit: 'Anatomia de uma moto de <span>MotoGP</span>', alt: 'Moto de MotoGP na curva (imagem gerada, sem equipe nem marca)' },
    stock: { d: window.ANATOMIA_STOCK, tit: 'Anatomia de um carro da <span>Stock Car</span>', alt: 'Dois carros da Stock Car disputando posição (imagem gerada, sem equipe nem marca)' },
    fe: { d: window.ANATOMIA_FE, tit: 'Anatomia de um carro da <span>Fórmula E</span>', alt: 'Carro da Fórmula E numa pista de rua à noite (imagem gerada, sem equipe nem marca)' },
    f2: { d: window.ANATOMIA_F2, tit: 'Anatomia de um carro da <span>Fórmula 2</span>', alt: 'Carro da Fórmula 2 numa pista de rua à beira-mar (imagem gerada, sem equipe nem marca)' },
    f3: { d: window.ANATOMIA_F3, tit: 'Anatomia de um carro da <span>Fórmula 3</span>', alt: 'Carros da Fórmula 3 em fila numa curva (imagem gerada, sem equipe nem marca)' },
    indy: { d: window.ANATOMIA_INDY, tit: 'Anatomia de um carro da <span>IndyCar</span>', alt: 'Carro da IndyCar num oval ao pôr do sol (imagem gerada, sem equipe nem marca)' },
    nascar: { d: window.ANATOMIA_NASCAR, tit: 'Anatomia de um carro da <span>NASCAR</span>', alt: 'Três carros da NASCAR lado a lado num oval à noite (imagem gerada, sem equipe nem marca)' },
    wec: { d: window.ANATOMIA_WEC, tit: 'Anatomia de um <span>Hypercar do WEC</span>', alt: 'Protótipo Hypercar à noite na chuva (imagem gerada, sem equipe nem marca)' },
    dtm: { d: window.ANATOMIA_DTM, tit: 'Anatomia de um carro do <span>DTM</span>', alt: 'Carros GT3 do DTM vistos de trás ao entardecer (imagem gerada, sem equipe nem marca)' },
    porsche: { d: window.ANATOMIA_PORSCHE, tit: 'Anatomia da <span>Porsche Cup</span>', alt: 'Carros da Porsche Cup em fila ao entardecer (imagem gerada, sem equipe)' },
    imsa: { d: window.ANATOMIA_IMSA, tit: 'Anatomia de um <span>protótipo do IMSA</span>', alt: 'Protótipo da classe GTP à noite na chuva (imagem gerada, sem equipe nem marca)' },
    wrc: { d: window.ANATOMIA_WRC, tit: 'Anatomia de um carro do <span>WRC</span>', alt: 'Carro de rali levantando poeira numa estrada de terra (imagem gerada, sem equipe nem marca)' } };
  var cartao = document.createElement('div'); cartao.className = 'an-cartao'; cartao.hidden = true;
  function mostrar(i) {
    var p = A.pecas[i];
    [].forEach.call(carro.querySelectorAll('.an-ponto'), function (b, k) { b.setAttribute('aria-pressed', k === i); });
    /* no celular o cartão não cabe em cima da foto: rola até a explicação na lista */
    if (window.matchMedia('(max-width: 760px)').matches) { var li = document.getElementById('an-p' + i); if (li && mostrar.tocou) li.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    cartao.innerHTML = '<h2>' + esc(p.nome) + '</h2><p class="an-num">' + esc(p.numero) + '</p><p>' + esc(p.texto) + '</p>';
    cartao.hidden = false;
    if (A === Q.motogp.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '46%'; return; } /* a moto: o lado direito da foto é pista vazia */
    if (A === Q.stock.d) { cartao.style.left = 'auto'; cartao.style.right = '3%'; cartao.style.top = '3%'; return; } /* a Stock: os pontos de cima ficam à esquerda */
    if (A === Q.wrc.d) { cartao.style.left = '2%'; cartao.style.right = 'auto'; cartao.style.top = '3%'; return; } /* o WRC: em cima à esquerda é floresta */
    if (A === Q.imsa.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '3%'; return; } /* o IMSA: em cima à direita é fundo escuro */
    if (A === Q.porsche.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '3%'; return; } /* a Porsche Cup: em cima à direita é céu */
    if (A === Q.dtm.d) { cartao.style.left = '2%'; cartao.style.right = 'auto'; cartao.style.top = '3%'; return; } /* o DTM: em cima à esquerda é céu */
    if (A === Q.wec.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '58%'; return; } /* o WEC: embaixo à direita é só pista */
    if (A === Q.nascar.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '3%'; return; } /* a NASCAR: em cima à direita é só céu */
    if (A === Q.indy.d) { cartao.style.left = '2%'; cartao.style.right = 'auto'; cartao.style.top = '62%'; return; } /* a Indy: embaixo à esquerda é só pista */
    if (A === Q.f3.d) { cartao.style.left = 'auto'; cartao.style.right = '2%'; cartao.style.top = '56%'; return; } /* a F3: o carro fica à esquerda, embaixo à direita é só pista */
    if (A === Q.fe.d || A === Q.f2.d) { cartao.style.left = '3%'; cartao.style.right = 'auto'; cartao.style.top = '3%'; return; } /* a Fórmula E: o carro fica à direita */
    /* o carro: cartão na parte escura de cima, do lado oposto ao ponto */
    cartao.style.left = p.x < 50 ? 'auto' : '3%'; cartao.style.right = p.x < 50 ? '3%' : 'auto';
    cartao.style.top = '3%';
  }
  function abrir(q) {
    var o = Q[q] || Q.f1; A = o.d;
    [].forEach.call(document.querySelectorAll('.an-abas button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-q') === q); });
    document.getElementById('an-tit').innerHTML = o.tit;
    img.src = A.foto; img.alt = o.alt; carro.style.aspectRatio = A.w + ' / ' + A.h;
    [].forEach.call(carro.querySelectorAll('.an-ponto'), function (b) { b.remove(); });
    A.pecas.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'an-ponto'; b.textContent = i + 1; b.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-label', p.nome); b.style.left = p.x + '%'; b.style.top = p.y + '%';
      b.addEventListener('click', function () { mostrar.tocou = true; mostrar(i); });
      carro.appendChild(b);
    });
    carro.appendChild(cartao);
    document.getElementById('an-ficha').innerHTML = A.ficha.map(function (f) { return '<div><b>' + esc(f[0]) + '</b><span>' + esc(f[1]) + '</span></div>'; }).join('');
    document.getElementById('an-lista').innerHTML = A.pecas.map(function (p, i) {
      return '<li id="an-p' + i + '"><h3><i>' + (i + 1) + '</i>' + esc(p.nome) + '</h3><p class="an-num">' + esc(p.numero) + '</p><p>' + esc(p.texto) + '</p></li>';
    }).join('');
    mostrar.tocou = false; mostrar(0);
    if (history.replaceState) history.replaceState(null, '', q !== 'f1' ? '#' + q : location.pathname);
  }
  [].forEach.call(document.querySelectorAll('.an-abas button'), function (b) { b.addEventListener('click', function () { abrir(b.getAttribute('data-q')); }); });
  abrir(Q[location.hash.slice(1)] ? location.hash.slice(1) : 'f1');
})();
</script>
