<style>
.oa-pagina { padding: calc(var(--topo) + 40px) 0 70px; }
.oa-pagina h1 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 5vw, 60px); line-height: 1.05; }
.oa-lead { max-width: 820px; margin: 0 0 18px; font-size: 18px; color: #c3c8cd; }
.oa-legenda { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 28px; font-size: 14px; color: var(--aco); }
.oa-legenda span { display: inline-flex; align-items: center; gap: 7px; }
.oa-legenda i { width: 14px; height: 14px; }
.oa-grupo-tit { margin: 30px 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sangue-vivo); }
.oa-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.oa-card { display: flex; flex-direction: column; background: var(--carbono); border: 1px solid var(--linha); border-bottom: 3px solid var(--sangue-vivo); }
.oa-foto { position: relative; display: block; height: 120px; overflow: hidden; background: #000; }
.oa-foto img { width: 100%; height: 100%; object-fit: cover; opacity: .55; transition: opacity .2s; }
.oa-foto:hover img { opacity: .75; }
.oa-foto b { position: absolute; left: 14px; bottom: 10px; font-family: var(--display); font-weight: 400; font-size: 22px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .8); }
.oa-card .oa-canais { padding: 12px; }
.oa-card .oa-nota { margin: 0; padding: 0 12px 12px; font-size: 13px; }
.oa-rodape { margin-top: 30px; font-size: 14px; color: var(--aco); }
</style>
</head>
<body data-pagina="onde-assistir">
<a class="pular" href="#oa">Pular para o conteúdo</a>
<header id="topo"></header>

<main class="oa-pagina" id="oa">
  <div class="moldura">
    <h1>Onde assistir em 2026.</h1>
    <p class="oa-lead">Os canais de TV e de streaming de cada categoria no Brasil, num lugar só. Toque em um canal para abrir.</p>
    <p class="oa-legenda"><span><i class="oa-aberta"></i>TV aberta</span><span><i class="oa-paga"></i>TV por assinatura</span><span><i class="oa-stream"></i>Streaming</span><span><i class="oa-gratis"></i>Grátis na internet</span></p>
    <div id="oa-lista"></div>
    <p class="oa-rodape" id="oa-rodape"></p>
  </div>
</main>

<footer id="rodape"></footer>
<script src="assets/js/dados.js?v=209"></script>
<script src="assets/js/site.js?v=209"></script>
<script src="assets/js/onde-assistir-dados.js?v=209"></script>
<script>
  /* Cartões por grupo de categorias (os grupos vêm de site.js) */
  (function () {
    var O = window.ONDE_ASSISTIR, esc = window.esc;
    document.getElementById('oa-lista').innerHTML = (window.GRUPOS || []).map(function (g) {
      return '<h2 class="oa-grupo-tit">' + esc(g.nome) + '</h2><div class="oa-grade">' + g.cats.map(function (c) {
        if (!O.cats[c.slug]) return '';
        return '<article class="oa-card"><a class="oa-foto" href="' + c.slug + '.html"><img src="' + c.foto + '" alt="" loading="lazy"><b>' + esc(c.menu || c.nome) + '</b></a>' +
          O.quadro(c.slug, true) + (O.cats[c.slug].nota ? '<p class="oa-nota">' + esc(O.cats[c.slug].nota) + '</p>' : '') + '</article>';
      }).join('') + '</div>';
    }).join('');
    document.getElementById('oa-rodape').textContent = 'Informações conferidas em ' + O.atualizado + ', com base nos anúncios das emissoras e na imprensa especializada. Os canais podem mudar de uma etapa para outra; na dúvida, confira a programação do canal no dia.';
  })();
</script>
</body>
</html>
