<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/js/idioma.js?v=215"></script>
<title>Minha conta | Automobilismo Na Veia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141619">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141619'/%3E%3Cpath d='M9 26L15 6h5l-6 20z' fill='%23b0121b'/%3E%3Cpath d='M17 26l6-20h4l-6 20z' fill='%23e4e7ea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Exo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilo.css?v=215">
<link rel="stylesheet" href="assets/css/planos.css?v=215">
<link rel="stylesheet" href="assets/css/conta.css?v=215">
</head>
<body data-pagina="conta">
<a class="pular" href="#conta">Pular para o conteúdo</a>
<header id="topo"></header>

<main class="ct-main" id="conta">
  <div class="moldura">
    <div class="ct-cab">
      <div><p class="ct-ola" id="ct-ola">Minha conta</p><h1 id="ct-titulo">Seu cockpit.</h1></div>
      <div class="ct-cab-acoes"><button type="button" class="ct-sair" id="ct-sair">Sair</button></div>
    </div>

    <div class="ct-grade">
      <section class="ct-bloco" aria-labelledby="ct-perfil-t">
        <h2 id="ct-perfil-t">Seu perfil</h2>
        <div class="ct-perfil-linha">
          <div class="ct-foto-caixa"><div class="ct-foto" id="ct-foto" aria-hidden="true"></div>
            <label class="ct-mini ct-foto-btn">Colocar foto<input type="file" id="ct-foto-arquivo" accept="image/*" hidden></label>
            <button type="button" class="ct-link ct-foto-tirar" id="ct-foto-tirar" hidden>Tirar foto</button>
            <p class="ct-erro" id="ct-foto-erro" hidden></p></div>
          <div class="ct-perfil-dados"><dl class="ct-perfil" id="ct-perfil"></dl>
            <button type="button" class="ct-mini" id="ct-editar">Editar perfil</button>
            <form class="ct-form-mini" id="f-perfil" hidden novalidate>
              <label>Nome<input type="text" name="nome" maxlength="60" autocomplete="name" required></label>
              <label>Piloto favorito<input type="text" name="piloto" maxlength="60" list="ct-lista-pilotos" placeholder="Ex.: Gabriel Bortoleto"></label>
              <datalist id="ct-lista-pilotos"></datalist>
              <p class="ct-erro" role="alert" hidden></p>
              <div class="ct-form-acoes"><button class="pl-botao" type="submit">Salvar</button><button type="button" class="ct-link" id="ct-editar-cancelar">Cancelar</button></div>
            </form></div>
        </div>
      </section>

      <section class="ct-bloco ct-plano" aria-labelledby="ct-plano-t">
        <h2 id="ct-plano-t">Seu plano</h2>
        <div id="ct-plano"></div>
      </section>

      <section class="ct-bloco" id="agenda-celular" aria-labelledby="ct-agenda-t">
        <h2 id="ct-agenda-t">Agenda do celular</h2>
        <div id="ct-agenda"></div>
      </section>

      <section class="ct-bloco" aria-labelledby="ct-numeros-t">
        <h2 id="ct-numeros-t">Seus números</h2>
        <div id="ct-numeros"></div>
      </section>

      <section class="ct-bloco" aria-labelledby="ct-pag-t">
        <h2 id="ct-pag-t">Histórico de pagamentos</h2>
        <div id="ct-pagamentos"><p class="ct-sub">Carregando…</p></div>
      </section>

      <section class="ct-bloco" aria-labelledby="ct-senha-t">
        <h2 id="ct-senha-t">Trocar senha</h2>
        <form class="ct-form-mini" id="f-senha" novalidate>
          <label>Senha atual<input type="password" name="atual" autocomplete="current-password" required></label>
          <label>Senha nova<input type="password" name="nova" autocomplete="new-password" minlength="8" required><small>Pelo menos 8 caracteres.</small></label>
          <label>Repita a senha nova<input type="password" name="nova2" autocomplete="new-password" minlength="8" required></label>
          <p class="ct-erro" role="alert" hidden></p><p class="ct-ok" role="status" hidden></p>
          <button class="pl-botao" type="submit">Trocar senha</button>
        </form>
      </section>

      <section class="ct-bloco ct-perigo" aria-labelledby="ct-excluir-t">
        <h2 id="ct-excluir-t">Excluir minha conta</h2>
        <p class="ct-sub">Apaga a sua conta e todos os seus dados. Se você tem assinatura no cartão, ela é cancelada. Não dá para desfazer.</p>
        <button type="button" class="ct-mini ct-perigo-btn" id="ct-excluir-abrir">Excluir minha conta</button>
        <form class="ct-form-mini" id="f-excluir" hidden novalidate>
          <label>Digite sua senha para confirmar<input type="password" name="senha" autocomplete="current-password" required></label>
          <p class="ct-erro" role="alert" hidden></p>
          <div class="ct-form-acoes"><button class="pl-botao ct-perigo-btn" type="submit">Excluir para sempre</button><button type="button" class="ct-link" id="ct-excluir-cancelar">Cancelar</button></div>
        </form>
      </section>

    </div>
  </div>
</main>

<footer id="rodape"></footer>
<script src="assets/js/dados.js?v=215"></script>
<script src="assets/js/site.js?v=215"></script>
<script src="assets/js/conta.js?v=215"></script>
</body>
</html>
