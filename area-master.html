<header id="topo"></header>

<main class="sm">
  <div class="moldura">
    <div class="sm-cab">
      <p class="sm-trilha"><span class="sm-selo">Grátis</span></p>
      <h1>Ferramentas.</h1>
      <p class="sm-lead">Todas as ferramentas do site, grátis, num lugar só.</p>

  </div>
</main>

<footer id="rodape"></footer>

<script>
  /* Área Master: atalhos para os recursos do plano. Só para o Master. */
  (function () {
    var caixa = document.getElementById('master');
    var itens = [
      ['previa.html', 'Prévia da etapa', 'Tudo sobre a próxima corrida: horários, previsão do tempo, mapa da pista, e cenários de título.'],
      ['simulador.html', 'Simulador completo', 'Escolha os pódios das corridas que faltam e veja quem leva o título, em todas as categorias.'],
      ['jogos.html', 'Jogos', 'Chefe de Equipe, Largada, Adivinhe o circuito e Piloto misterioso, sem limite.'],
      ['raiox.html', 'Raio-x da F1', 'A última corrida da F1 volta a volta, com pneus e tempos, e a telemetria da F1 para comparar a volta de dois pilotos.']
    ];
    function trava(titulo, texto, botoes) {
      caixa.innerHTML = '<div class="sm-trava"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '<h2>' + titulo + '</h2><p>' + texto + '</p><div class="sm-trava-acoes">' + botoes + '</div></div>';
    }
    caixa.innerHTML = '<p class="nota">Carregando…</p>';
    window.NAVEIA_LIVRE.then(function (r) {
      if (r.semServidor) return trava('Área Master indisponível agora', 'Não foi possível confirmar sua conta. Tente de novo em alguns minutos.', '<a class="pl-botao" href="area-master.html">Tentar de novo</a>');
      if (!r.logado) return trava('Exclusivo do plano Master', 'Entre na sua conta para abrir a Área Master. Se ainda não assina, conheça o Master.', '<a class="pl-botao" href="entrar.html?volta=area-master.html">Entrar</a><a class="pl-botao pl-botao-linha" href="planos.html">Ver os planos</a>');
      if (r.usuario.plano !== 'master') return trava('Exclusivo do plano Master', 'Seu plano atual não inclui a Área Master. Mude para o Master e libere tudo.', '<a class="pl-botao" href="planos.html">Conhecer o Master</a>');
      caixa.innerHTML = '<ul class="am-lista">' + itens.map(function (i) {
        return '<li><a class="am-item" href="' + i[0] + '"><h2>' + i[1] + '</h2><p>' + i[2] + '</p><span class="botao botao-linha">Abrir</span></a></li>';
      }).join('') + '</ul>';
    });
  })();
</script>
