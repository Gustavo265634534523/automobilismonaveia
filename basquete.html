  <section class="ft-hero">
    <div class="ft-hero-img" aria-hidden="true"><img src="assets/img/fotos/basquete.webp" alt="" fetchpriority="high"></div>

      <div id="ft-grande"></div>
    </div>
  </section>
  <section class="ft-caixa ft-recentes" aria-labelledby="ft-rec-t">
    <div class="ft-rec-cab"><div><p class="ft-rot">Placar</p><h2 id="ft-rec-t">Jogos recentes</h2></div>
      <div class="ft-setas"><button type="button" id="ft-rec-ant" aria-label="Anteriores">‹</button><button type="button" id="ft-rec-prox" aria-label="Próximos">›</button></div></div>

  </section>
  <section class="ft-caixa ft-sec" id="sec-craque" hidden aria-labelledby="cq-t">

    <div class="cq-grade" id="cq-grade"></div>
  </section>
  <section class="ft-caixa" id="sec-aovivo" aria-label="Ao vivo e meu time">
    <div class="em-vivo-box" id="em-aovivo"></div>
    <div id="em-meutime"></div>

  <section class="ft-caixa ft-sec" id="ft-tabelas" aria-labelledby="ft-tab-t">

    <div class="ft-abas" id="ft-tab-abas" role="tablist" aria-label="Campeonato"></div>
    <div id="ft-tabela"></div>
  </section>
  <section class="ft-caixa ft-sec" id="sec-chave" aria-labelledby="ch-t">

    <div class="ft-abas" id="ch-abas" role="tablist" aria-label="Campeonato"></div>
    <div id="ch-caixa"></div>
  </section>
  <section class="ft-caixa ft-sec" id="sec-lideres" aria-labelledby="lid-t">
    <p class="ft-rot">Estatísticas</p><h2 id="lid-t">Líderes da NBA</h2>
    <div id="lid-caixa" style="margin-top:24px"></div>
  </section>
  <section class="ft-caixa ft-sec" id="sec-noticias" aria-labelledby="ft-not-t">
    <div class="ft-not-cab"><h2 id="ft-not-t">Últimas notícias</h2><div class="ft-abas ft-abas-pq" id="ft-not-abas" role="tablist" aria-label="Filtrar notícias"></div></div>
    <div class="ft-noticias" id="ft-noticias"></div>
    <p class="ft-centro"><button type="button" class="ft-btn ft-btn-linha" id="ft-not-mais">Mais notícias</button></p>
  </section>
  <section class="ft-caixa ft-sec" id="sec-mercado" aria-labelledby="mk-t">
    <div class="ft-not-cab"><div><p class="ft-rot">Trocas, contratos e reforços</p><h2 id="mk-t">Mercado</h2></div><a class="ft-btn ft-btn-linha" href="mercado.html#basquete">Ver tudo</a></div>
