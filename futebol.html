<a class="pular" href="#ft">Pular para o conteúdo</a>
<header id="topo"></header>
<main class="ft" id="ft">
  <!-- Página do futebol (assets/js/futebol.js): destaque, resultados, agenda, classificação, notícias e campeonatos -->
  <section class="ft-hero">
    <div class="ft-hero-img" aria-hidden="true"><img src="assets/img/esportes/futebol.webp" alt="" fetchpriority="high"></div>
    <div class="ft-caixa ft-hero-txt">
      <p class="ft-rot">Brasileirão, Libertadores, Sul-Americana e Europa</p>
      <h1>Futebol<br><span>Na Veia</span></h1>
      <div id="ft-grande"></div>
    </div>
  </section>
  <section class="ft-caixa ft-recentes" aria-labelledby="ft-rec-t">
    <div class="ft-rec-cab"><div><p class="ft-rot">Placar</p><h2 id="ft-rec-t">Jogos recentes</h2></div>
      <div class="ft-setas"><button type="button" id="ft-rec-ant" aria-label="Anteriores">‹</button><button type="button" id="ft-rec-prox" aria-label="Próximos">›</button></div></div>
    <div class="ft-rec-trilho" id="ft-recentes"></div>
  </section>
  <section class="ft-caixa ft-sec" aria-labelledby="ft-ag-t">
    <div class="ft-agenda">
      <div class="ft-agenda-intro"><p class="ft-rot">Próximos dias</p><h2 id="ft-ag-t">Agenda</h2><p>Os próximos jogos dos campeonatos que o site acompanha, no horário de Brasília.</p><a class="ft-btn" href="#ft-tabelas">Classificação</a></div>
      <div class="ft-agenda-lista" id="ft-agenda"></div>
    </div>
  </section>
  <section class="ft-caixa ft-sec" id="ft-tabelas" aria-labelledby="ft-tab-t">
    <p class="ft-rot ft-centro">Classificação</p><h2 class="ft-centro" id="ft-tab-t">Tabelas</h2>
    <div class="ft-abas" id="ft-tab-abas" role="tablist" aria-label="Campeonato"></div>
    <div id="ft-tabela"></div>
  </section>
  <section class="ft-caixa ft-sec" aria-labelledby="ft-not-t">
    <div class="ft-not-cab"><h2 id="ft-not-t">Últimas notícias</h2><div class="ft-abas ft-abas-pq" id="ft-not-abas" role="tablist" aria-label="Filtrar notícias"></div></div>
    <div class="ft-noticias" id="ft-noticias"></div>
    <p class="ft-centro"><button type="button" class="ft-btn ft-btn-linha" id="ft-not-mais">Mais notícias</button></p>
  </section>
  <section class="ft-caixa ft-sec" aria-labelledby="ft-camp-t">
    <h2 id="ft-camp-t">Campeonatos</h2>
    <div class="ft-camps" id="ft-camps"></div>
    <p class="ft-atualizado" id="ft-atualizado"></p>
  </section>
